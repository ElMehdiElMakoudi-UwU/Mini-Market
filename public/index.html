<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ميني ماركت الشدادي — القصر الكبير</title>
  <meta name="description" content="Mini Market Cheddadi — Ksar El Kebir. Commandez vos courses en ligne, livraison à domicile, paiement à la livraison.">
  <meta name="theme-color" content="#4e2a18">
  <link rel="icon" href="/img/logo.jpg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="الشدادي">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="topbar" data-i18n="topbar"></div>

  <header class="site">
    <div class="header-inner">
      <a class="brand" href="/">
        <img src="/img/logo.jpg" alt="Mini Market Cheddadi">
        <span class="brand-text"><b data-i18n="brand">ميني ماركت</b><small data-i18n="brand2">الشدادي</small></span>
      </a>
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="search" type="search" autocomplete="off" data-i18n-ph="search">
      </label>
      <button class="icon-btn track-btn" id="trackBtn" title="Suivi">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h11v10H3zM14 10h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>
        <span class="label" data-i18n="track"></span>
      </button>
      <button class="icon-btn" id="langBtn">FR</button>
      <button class="icon-btn cart-btn" id="cartBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        <span class="label" data-i18n="cart"></span>
        <span class="cart-count" id="cartCount">0</span>
      </button>
    </div>
  </header>

  <section class="hero">
    <div class="hero-card">
      <div class="hero-content">
        <h1 data-i18n="heroTitle"></h1>
        <p data-i18n="heroSub"></p>
        <div class="chips" id="heroChips"></div>
      </div>
    </div>
  </section>
  <div class="closed-banner hidden" id="closedBanner" data-i18n="closed"></div>
  <div class="install-bar hidden" id="installBar">
    <img src="/img/icon-192.png" alt="">
    <span id="installText"></span>
    <button class="btn btn-primary" id="installBtn" data-i18n="installBtn"></button>
    <button class="icon-btn" id="installClose" aria-label="close">✕</button>
  </div>

  <div class="cats-wrap"><nav class="cats" id="cats"></nav></div>

  <main id="products"></main>

  <footer class="site">
    <div class="footer-inner">
      <div>
        <h4 data-i18n="brandFull"></h4>
        <p data-i18n="footerAbout"></p>
      </div>
      <div>
        <h4 data-i18n="contact"></h4>
        <p data-i18n="city"></p>
        <p><span data-i18n="phone"></span>: <a id="footPhone" dir="ltr"></a></p>
        <p><span data-i18n="hours"></span>: <span id="footHours" dir="ltr"></span></p>
      </div>
      <div>
        <h4 data-i18n="howTitle"></h4>
        <p data-i18n="how1"></p>
        <p data-i18n="how2"></p>
        <p data-i18n="how3"></p>
      </div>
    </div>
  </footer>

  <div class="bottom-bar" id="bottomBar">
    <button class="btn btn-primary" id="bottomCartBtn">
      <span><span data-i18n="viewCart"></span> (<span id="bottomCount">0</span>)</span>
      <b id="bottomTotal"></b>
    </button>
  </div>

  <!-- Cart drawer -->
  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle"></h2>
      <button class="icon-btn" id="closeDrawer" aria-label="close">✕</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
    <div class="drawer-foot" id="drawerFoot"></div>
  </aside>

  <!-- Track modal -->
  <div class="modal hidden" id="trackModal">
    <div class="overlay open" data-close></div>
    <div class="modal-card">
      <h2 data-i18n="trackTitle"></h2>
      <form id="trackForm">
        <div class="field"><label data-i18n="orderNo"></label><input name="id" inputmode="numeric" required></div>
        <div class="field"><label data-i18n="phone"></label><input name="phone" type="tel" inputmode="tel" dir="ltr" required placeholder="06 XX XX XX XX"></div>
        <p class="error hidden" id="trackError"></p>
        <button class="btn btn-primary btn-block" data-i18n="check"></button>
      </form>
      <div id="trackResult"></div>
      <button class="btn btn-ghost btn-block" style="margin-top:10px" data-close data-i18n="close"></button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
